<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bean</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="app.css">
</head>
<body data-phase="idle">
  <main>
    <div class="col">
      <section id="stage" class="card" aria-label="Game">
        <div id="light" aria-hidden="true">
          <svg id="glyph" viewBox="0 0 24 24"><path id="glyph-path" fill-rule="evenodd" d=""/></svg>
        </div>
        <h1 id="status" role="status" aria-live="assertive">Bean is ready</h1>
        <p id="hint" aria-live="polite"></p>
        <p id="readout">Distance: <output id="reading">none yet</output></p>
        <div id="track" hidden>
          <div id="track-cells" aria-hidden="true"></div>
          <p id="track-text"></p>
        </div>
        <div id="timer" aria-hidden="true" hidden></div>
      </section>

      <button id="step" class="primary" hidden>Step</button>

      <div id="controls">
        <button id="start" class="primary">Start</button>
        <button id="stop">Stop</button>
      </div>

      <section id="parent" aria-label="Grown-up buttons" hidden>
        <button id="ready" class="primary">Kid is back at start</button>
        <button id="goodtry" class="primary" hidden>Good try</button>
        <button id="yes" class="primary" hidden>They did it</button>
        <button id="no" hidden>Not yet</button>
      </section>
    </div>

    <div class="col">
      <!-- First in this column, not under the game: on a phone the order is the same, and on a laptop the sticky game column fits the screen. -->
      <section id="progress" class="card" aria-labelledby="progress-h">
        <div class="head">
          <h2 id="progress-h">Progress</h2>
          <button id="reset">Reset</button>
        </div>
        <dl id="totals">
          <div><dt>Rounds</dt><dd id="t-rounds">0</dd></div>
          <div><dt>Wins</dt><dd id="t-wins">0</dd></div>
          <div><dt>Good freezes</dt><dd id="t-freezes">0</dd></div>
          <div><dt>Word tries</dt><dd id="t-words">0</dd></div>
        </dl>
      </section>

      <section id="robot" class="card" aria-labelledby="robot-h">
        <h2 id="robot-h">Robot</h2>
        <div class="row">
          <button id="connect">Connect by cable</button>
          <button id="connect-wifi">Connect over WiFi</button>
          <p id="link" role="status">Playing with the pretend robot.</p>
        </div>
        <p id="phone" hidden></p>
        <div id="mock">
          <label for="distance">Pretend robot: how far away the kid is <output id="distance-out" for="distance">180 cm</output></label>
          <input id="distance" type="range" min="0" max="200" value="180">
          <p id="mock-state"><span id="mock-light" aria-hidden="true"></span><span id="mock-head">Bean is facing the kid</span></p>
        </div>
      </section>

      <details id="settings" class="card">
        <summary>Grown-up settings</summary>
        <fieldset class="choice"><legend>Game</legend>
          <label><input id="s-freeze" type="radio" name="s-game" checked> Freeze Watcher</label>
          <label><input id="s-sneak" type="radio" name="s-game"> Say It to Sneak</label>
          <label><input id="s-says" type="radio" name="s-game"> Robot Says</label>
        </fieldset>
        <fieldset class="choice"><legend>How the kid moves</legend>
          <label><input id="s-body" type="radio" name="s-input" checked> Moves their body</label>
          <label><input id="s-switch" type="radio" name="s-input"> Presses a switch</label>
        </fieldset>
        <div class="field"><label for="s-steps">Switch presses to win</label>
          <span class="num"><span class="val"><input id="s-steps" type="number" inputmode="numeric"><span class="unit" aria-hidden="true">steps</span></span></span></div>
        <div class="field"><label for="s-greenMin">Shortest green light <span class="vh">(seconds)</span></label>
          <span class="num"><span class="val"><input id="s-greenMin" type="number" inputmode="decimal" step="0.5"><span class="unit" aria-hidden="true">sec</span></span></span></div>
        <div class="field"><label for="s-greenMax">Longest green light <span class="vh">(seconds)</span></label>
          <span class="num"><span class="val"><input id="s-greenMax" type="number" inputmode="decimal" step="0.5"><span class="unit" aria-hidden="true">sec</span></span></span></div>
        <div class="field"><label for="s-settle">Time to freeze before Bean checks <span class="vh">(seconds)</span></label>
          <span class="num"><span class="val"><input id="s-settle" type="number" inputmode="decimal" step="0.1"><span class="unit" aria-hidden="true">sec</span></span></span></div>
        <div class="field"><label for="s-look">How long Bean stares <span class="vh">(seconds)</span></label>
          <span class="num"><span class="val"><input id="s-look" type="number" inputmode="decimal" step="0.5"><span class="unit" aria-hidden="true">sec</span></span></span></div>
        <div class="field"><label for="s-doIt">Time to do each command <span class="vh">(seconds)</span></label>
          <span class="num"><span class="val"><input id="s-doIt" type="number" inputmode="decimal" step="0.5"><span class="unit" aria-hidden="true">sec</span></span></span></div>
        <div class="field"><label for="s-leewayCm">Wiggle room before caught <span class="vh">(cm)</span></label>
          <span class="num"><span class="val"><input id="s-leewayCm" type="number" inputmode="numeric"><span class="unit" aria-hidden="true">cm</span></span></span></div>
        <div class="field"><label for="s-winCm">Win when closer than <span class="vh">(cm)</span></label>
          <span class="num"><span class="val"><input id="s-winCm" type="number" inputmode="numeric"><span class="unit" aria-hidden="true">cm</span></span></span></div>
        <div class="words"><label for="s-words">Practice words</label>
          <input id="s-words" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-describedby="s-words-help">
          <p id="s-words-help">Put a comma between words.</p></div>
      </details>
    </div>
  </main>
  <script type="module" src="main.js"></script>
</body>
</html>
